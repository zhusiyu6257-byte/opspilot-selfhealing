global:
  resolve_timeout: 1m

route:
  receiver: opspilot-webhook
  group_by: ["alertname", "ip"]
  group_wait: 1s
  group_interval: 5s
  # 后端冷却默认 600 秒：这里调短也只是让后端回「本次跳过」，
  # 不会反复远程执行命令。
  repeat_interval: 2m

receivers:
  - name: opspilot-webhook
    webhook_configs:
      - url: https://host.docker.internal:8000/api/v1/alerts/webhook
        send_resolved: false
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/secrets/opspilot_token
          # 本地自签证书专用；生产必须删除并改用可信 CA。
          tls_config:
            insecure_skip_verify: true
