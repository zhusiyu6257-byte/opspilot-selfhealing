global:
  resolve_timeout: 1m

route:
  receiver: opspilot-webhook
  group_by: ["alertname", "ip"]
  group_wait: 1s
  group_interval: 5s
  # 后端冷却默认 600 秒：这里调短也只是让后端回「本次跳过」，
  # 不会反复远程执行命令。
  repeat_interval: 2m

receivers:
  - name: opspilot-webhook
    webhook_configs:
      - url: https://host.docker.internal:8000/api/v1/alerts/webhook
        send_resolved: false
        http_config:
          authorization:
            type: Bearer
            # Token 走 Docker Secret，只挂载不进配置仓库。
            credentials_file: /run/secrets/opspilot_token
          # 后端证书由本地私有 CA 签发，容器挂载 ca.crt 做真正的校验。
          # 不再使用 insecure_skip_verify。
          tls_config:
            ca_file: /etc/opspilot/ca.crt
