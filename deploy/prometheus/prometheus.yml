global:
  scrape_interval: 5s
  evaluation_interval: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["opspilot-alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: opspilot-backend
    scheme: https
    metrics_path: /api/v1/metrics/host
    # 后端证书由本地私有 CA 签发，容器挂载 ca.crt 做真正的服务端身份校验。
    # 不再使用 insecure_skip_verify。生产环境把 ca.crt 换成可信 CA 证书包即可，
    # 这里的结构不用改。
    tls_config:
      ca_file: /etc/opspilot/ca.crt
    static_configs:
      - targets: ["host.docker.internal:8000"]
