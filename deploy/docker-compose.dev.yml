services:
  opspilot-postgres:
    image: postgres:16-alpine
    container_name: opspilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: opspilot_db
      POSTGRES_USER: opspilot_user
      POSTGRES_PASSWORD: opspilot_password
    ports:
      - "5432:5432"
    volumes:
      - opspilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspilot_user -d opspilot_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - opspilot-net

  opspilot-redis:
    image: redis:7-alpine
    container_name: opspilot-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - opspilot_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - opspilot-net

  opspilot-prometheus:
    image: prom/prometheus:v3.5.0
    container_name: opspilot-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - opspilot-net
    depends_on:
      - opspilot-redis

  opspilot-alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: opspilot-alertmanager
    restart: unless-stopped
    # 以宿主机本地用户身份运行，才能读取 mode 600 的 Token 文件
    user: "1000:1000"
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.dev.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./secrets:/etc/alertmanager/secrets:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - opspilot-net
    depends_on:
      - opspilot-prometheus

volumes:
  opspilot_pgdata:
  opspilot_redisdata:

networks:
  opspilot-net:
    driver: bridge
