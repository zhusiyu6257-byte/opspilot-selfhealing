services:
  opspilot-postgres:
    image: postgres:16-alpine
    container_name: opspilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: opspilot_db
      POSTGRES_USER: opspilot_user
      POSTGRES_PASSWORD: opspilot_password
    ports:
      - "5432:5432"
    volumes:
      - opspilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspilot_user -d opspilot_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - opspilot-net

  opspilot-redis:
    image: redis:7-alpine
    container_name: opspilot-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - opspilot_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - opspilot-net

volumes:
  opspilot_pgdata:
  opspilot_redisdata:

networks:
  opspilot-net:
    driver: bridge
